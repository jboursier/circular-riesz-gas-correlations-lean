# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Decay of correlations and thermodynamic limit for the circular Riesz gas"
  description: >-
    A Lean 4 formalization of the paper "Decay of correlations and thermodynamic limit for
    the circular Riesz gas" by Jeanne Boursier: long-range gap correlations and sharpness of
    the decay exponent (Theorem 1), short-range gap correlations (Theorem 2), a unique local
    total variation limit (Theorem 3), quantitative convergence of labelled gaps to the Palm
    law (Theorem 4), count and Palm span CLTs, variance asymptotics and hyperuniformity
    (Corollary 1.1), and Palm gap repulsion (Proposition 1.2). All statements hold for every
    beta > 0 in their respective exponent ranges. The development imports Mathlib and the
    companion formalization Riesz1, and uses its proved results.
    The six main results have Mathlib-only comparator pairs under Riesz2Audit/.
  authors:
    - "Jeanne Boursier"
  responsible_maintainers:
    - "Jeanne Boursier"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "math-ph"]
  msc2020: ["82B05", "60F05", "82B21", "60G55", "60B20"]

sources:
  - title: "Decay of correlations and thermodynamic limit for the circular Riesz gas"
    authors:
      - "Jeanne Boursier"
    type: "paper"
    relationship: "formalizes"
    location: "https://arxiv.org/abs/2209.00396"
    note: >-
      Revised version (2026). The repository uses its numbering: Theorems 1, 2, 3 and 4,
      Corollary 1.1 and Proposition 1.2. The encodings and additional explicit conclusions
      are described under fidelity.divergences and in the README.
    license: "author's copyright"
    author_endorsement: "participated"
  - title: "Optimal local laws and central limit theorem for the circular Riesz gas"
    authors:
      - "Jeanne Boursier"
    type: "paper"
    relationship: "background"
    location: "https://arxiv.org/abs/2112.05881"
    note: >-
      Proved companion results, imported as the Lake package Riesz1 from
      https://github.com/jboursier/circular-riesz-gas-lean at commit
      72fbdc2b2ea09a2ad64b8ae25074f30a3805b747. This repository uses the proved results of
      the imported formalization, including its proved external results.
    license: "author's copyright"
    author_endorsement: "participated"
  - title: "NIST Digital Library of Mathematical Functions, Equation 25.13.3"
    type: "reference"
    relationship: "independently-proves"
    location: "https://dlmf.nist.gov/25.13.E3"
    note: >-
      Proved periodic-zeta connection formula with ordered cosine partial sums.
      Statement: Riesz2.External.PeriodicZeta in Riesz2/Frozen/External/PeriodicZeta.lean.
      Proof: Riesz2.External.periodicZeta, with provider
      Riesz2.Main.External.periodicZeta in Riesz2/Main/External/PeriodicZeta.lean.
  - title: "Locally uniform long-range gap rigidity from the companion paper"
    authors:
      - "Jeanne Boursier"
    type: "paper"
    relationship: "independently-proves"
    location: "https://arxiv.org/abs/2112.05881"
    note: >-
      Proved compact-temperature uniformity of the companion Theorem 1(1), the clause
      not exported by the pinned companion theorem. The fixed-temperature rigidity
      theorem itself is imported. Statement: Riesz2.External.LongRangeRigidityLocallyUniform
      in Riesz2/Frozen/External/LongRangeRigidityLocallyUniform.lean. Proof:
      Riesz2.External.longRangeRigidityLocallyUniform, with provider in
      Riesz2/Main/External/LongRangeRigidityLocallyUniform.lean.
    license: "author's copyright"
    author_endorsement: "participated"
  - title: "Dimensionality and the stability of the Brunn–Minkowski inequality"
    authors:
      - "Ronen Eldan"
      - "Bo'az Klartag"
    type: "paper"
    relationship: "independently-proves"
    location: "https://arxiv.org/abs/1110.6584"
    note: >-
      Proved one-dimensional log-concave central density bound and Poincare inequality,
      Lemmas 2.1 and 2.2(b). Statement: Riesz2.External.ThermodynamicLogConcavity in
      Riesz2/Frozen/External/ThermodynamicLogConcavity.lean. Proof:
      Riesz2.External.thermodynamicLogConcavity, with provider in
      Riesz2/Main/External/ThermodynamicLogConcavity.lean.
  - title: "Theoretical properties of the log-concave maximum likelihood estimator of a multidimensional density"
    authors:
      - "Madeleine Cule"
      - "Richard Samworth"
    type: "paper"
    relationship: "independently-proves"
    location: "https://doi.org/10.1214/09-EJS505"
    note: >-
      Proved log-concave density convergence and exponential tails, Lemma 1 and
      Proposition 2(a),(c). Statement: Riesz2.External.LogConcaveConvergence in
      Riesz2/Frozen/External/LogConcaveConvergence.lean. Proof:
      Riesz2.External.logConcaveConvergence, with provider in
      Riesz2/Main/External/LogConcaveConvergence.lean. The convergence statement includes
      a log-concave representative and unweighted and exponentially weighted L1 convergence.

